<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Simple HTML</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 40px; }
		.card { border: 1px solid #ddd; padding: 20px; border-radius: 6px; max-width: 480px; }
		h1 { margin-top: 0; }
		.price { color: #2a9d8f; font-weight: bold; }
	</style>
</head>
<body>
	<div class="card">
		<h1>Product Name</h1>
		<p>A short description of the product goes here. Keep it concise and informative.</p>
		<p class="price">$19.99</p>
		<button onclick="alert('Added to cart')">Add to cart</button>
	</div>
</body>
</html>
